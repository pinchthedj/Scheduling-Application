name: planner_app
description: "A calming, aesthetic planner app."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.9.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # 📅 Calendar (Weekly / Monthly)
  table_calendar: ^3.1.0
  intl: ^0.19.0

  # 💾 Local Storage (Offline)
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # 📄 PDF Export
  pdf: ^3.10.4
  printing: ^5.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/background.png
